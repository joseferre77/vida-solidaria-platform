name: CI (build + type-check)

# Este workflow SOLO valida el código en cada push/PR — no despliega nada.
# El deploy real a Hostinger lo hace la plataforma de Hostinger directamente
# (Node.js App conectada por Git: cada push a la rama configurada dispara su
# propio build+deploy automático en hPanel). Ver DEPLOY.md.
#
# Si en el futuro migrás a un VPS propio, el workflow con deploy por SSH
# queda guardado en deploy/vps-appendix/github-actions-deploy-vps.yml.txt —
# renombralo a .yml acá adentro para reactivarlo.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vida-solidaria/api exec tsc --noEmit
      - run: pnpm --filter @vida-solidaria/web build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000' }}
          NEXT_PUBLIC_SOCKET_URL: ${{ vars.NEXT_PUBLIC_SOCKET_URL || 'http://localhost:4000' }}
