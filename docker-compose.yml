# Entorno local de desarrollo (Postgres + PostGIS + Redis).
# En Hostinger (producción) se usa el mismo esquema contra la instancia
# Postgres del VPS — ver ARCHITECTURE.md §1.
services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: vida_solidaria
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: vida_solidaria
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
